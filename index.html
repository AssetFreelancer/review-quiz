<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квиз</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ===== Цвета: берутся из темы Telegram, если она есть ===== */
  :root{
    --bg: var(--tg-theme-bg-color, #f6f3fb);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1d1730);
    --hint: var(--tg-theme-hint-color, #8a83a0);
    --accent: var(--tg-theme-button-color, #6c3cf0);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --line: color-mix(in srgb, var(--text) 10%, transparent);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);
    font-family:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
    padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
  }
  .app{max-width:520px;margin:0 auto;min-height:100%;padding:20px 18px 28px;display:flex;flex-direction:column}

  /* Прогресс */
  .progress{display:flex;gap:6px;margin-bottom:26px}
  .progress span{flex:1;height:6px;border-radius:6px;background:var(--line);transition:background .35s}
  .progress span.done{background:var(--accent)}

  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .big-emoji{font-size:64px;line-height:1;margin:24px 0 18px}
  h1,h2{font-family:"Unbounded","Golos Text",sans-serif;font-weight:700;letter-spacing:-.01em}
  h1{font-size:26px;line-height:1.2;margin-bottom:12px}
  h2{font-size:21px;line-height:1.25;margin-bottom:8px}
  p.sub{color:var(--hint);font-size:15px;line-height:1.5;margin-bottom:22px}
  .step{color:var(--hint);font-size:13px;margin-bottom:8px}

  /* ===== Кнопки-ответы ===== */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{
    --c:#6c3cf0;               /* цвет варианта задаётся в JS */
    position:relative;border:2px solid var(--line);background:var(--card);color:var(--text);
    border-radius:20px;padding:18px 14px 16px;text-align:left;cursor:pointer;
    font:500 15px/1.3 "Golos Text",sans-serif;min-height:118px;
    display:flex;flex-direction:column;justify-content:space-between;gap:10px;
    transition:transform .15s, background .3s, border-color .3s, color .3s, box-shadow .3s;
  }
  .opt:active{transform:scale(.97)}
  .opt:focus-visible{outline:3px solid var(--c);outline-offset:2px}
  .opt .ico{
    width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:26px;
    background:color-mix(in srgb, var(--c) 16%, transparent);transition:background .3s, transform .3s;
  }
  .opt .check{
    position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;
    border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:transparent;
    transition:all .25s;
  }
  /* Выбранный вариант: заливка своим цветом + «прыжок» иконки */
  .opt.selected{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 10px 24px -10px var(--c)}
  .opt.selected .ico{background:rgba(255,255,255,.22);animation:pop .45s ease}
  .opt.selected .check{background:#fff;border-color:#fff;color:var(--c)}
  .opt.dim{opacity:.55}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25) rotate(-8deg)}100%{transform:scale(1)}}

  .btn{
    margin-top:auto;border:0;border-radius:16px;padding:16px;width:100%;
    background:var(--accent);color:var(--accent-text);font:600 16px "Golos Text",sans-serif;cursor:pointer;
  }
  .btn:disabled{opacity:.4}
  .result-list{list-style:none;margin:6px 0 24px;display:grid;gap:10px}
  .result-list li{background:var(--card);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4}
  .result-list b{display:block;color:var(--hint);font-weight:500;font-size:12px;margin-bottom:2px}
  .spinner{width:42px;height:42px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;margin:40px 0 20px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="progress" id="progress"></div>

  <!-- Старт -->
  <section class="screen active" id="start">
    <div class="big-emoji">🎁</div>
    <h1>Подберём подарок за 4 вопроса</h1>
    <p class="sub">Ответьте на несколько вопросов — и мы пришлём подборку прямо в этот чат.</p>
    <button class="btn" id="startBtn">Начать</button>
  </section>

  <!-- Вопрос (заполняется из JS) -->
  <section class="screen" id="question">
    <div class="step" id="step"></div>
    <h2 id="qTitle"></h2>
    <p class="sub" id="qHint"></p>
    <div class="options" id="options"></div>
  </section>

  <!-- Проверка ответов -->
  <section class="screen" id="review">
    <h2>Проверьте ответы</h2>
    <p class="sub">Нажмите «Отправить», и результат придёт в чат с ботом.</p>
    <ul class="result-list" id="resultList"></ul>
    <button class="btn" id="sendBtn">Отправить</button>
  </section>

  <!-- Отправка / готово -->
  <section class="screen" id="done">
    <div class="spinner" id="spinner"></div>
    <div class="big-emoji" id="doneEmoji" style="display:none">✅</div>
    <h2 id="doneTitle">Отправляем…</h2>
    <p class="sub" id="doneText"></p>
  </section>
</div>

<script>
/* =========================================================
   1. НАСТРОЙКИ SALEBOT — заполните своё
   ========================================================= */
const SALEBOT = {
  apiKey:  "2fd2e5b55ab1422a4c2989cf4ecd08d8",          // Salebot → Настройки → API ключ
  botName: "Happiness_as_system_payment_bot",      // username бота БЕЗ @ (это group_id)
  trigger: "quiz_done"               // текст-триггер для блока в Salebot
};

/* =========================================================
   2. ВОПРОСЫ — меняйте текст, эмодзи и цвета как угодно
   ========================================================= */
const QUESTIONS = [
  { key:"q1", title:"Для кого подарок?", hint:"Выберите один вариант",
    options:[
      {text:"Для мамы",   icon:"🌷", color:"#e2557a"},
      {text:"Для мужа",   icon:"🧔", color:"#2f7de1"},
      {text:"Для ребёнка",icon:"🧸", color:"#f0a020"},
      {text:"Для друга",  icon:"🤝", color:"#18a874"} ]},
  { key:"q2", title:"Какой повод?", hint:"Что празднуем",
    options:[
      {text:"День рождения", icon:"🎂", color:"#9b51e0"},
      {text:"Свадьба",       icon:"💍", color:"#d9488f"},
      {text:"Праздник",      icon:"🎉", color:"#f26b3a"},
      {text:"Просто так",    icon:"💛", color:"#c9a40e"} ]},
  { key:"q3", title:"Какой бюджет?", hint:"Примерно, в вашей валюте",
    options:[
      {text:"До 100",     icon:"🪙", color:"#5a8f29"},
      {text:"100–300",    icon:"💵", color:"#1f9aa8"},
      {text:"300–700",    icon:"💳", color:"#3d5ce6"},
      {text:"Больше 700", icon:"💎", color:"#8a3ffc"} ]},
  { key:"q4", title:"Что ему ближе?", hint:"Стиль подарка",
    options:[
      {text:"Практичное", icon:"🛠️", color:"#56606e"},
      {text:"Красивое",   icon:"🌸", color:"#e05a9c"},
      {text:"Вкусное",    icon:"🍫", color:"#a0522d"},
      {text:"Впечатления",icon:"✈️", color:"#0f8fd6"} ]}
];

/* =========================================================
   3. ЛОГИКА
   ========================================================= */
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

const answers = {};
let current = 0;

const $ = id => document.getElementById(id);
const show = id => { document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); };
const haptic = t => tg?.HapticFeedback?.selectionChanged?.() ;

// Полоса прогресса
$("progress").innerHTML = QUESTIONS.map(()=>"<span></span>").join("");
function paintProgress(){ [...$("progress").children].forEach((s,i)=>s.classList.toggle("done", i < Object.keys(answers).length)); }

function renderQuestion(){
  const q = QUESTIONS[current];
  $("step").textContent = `Вопрос ${current+1} из ${QUESTIONS.length}`;
  $("qTitle").textContent = q.title;
  $("qHint").textContent = q.hint;
  $("options").innerHTML = "";
  q.options.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt" + (answers[q.key]===o.text ? " selected" : "");
    b.style.setProperty("--c", o.color);
    b.innerHTML = `<span class="ico">${o.icon}</span><span>${o.text}</span><span class="check">✓</span>`;
    b.onclick = () => choose(q, o, b);
    $("options").appendChild(b);
  });
  show("question");
  tg?.BackButton?.show();
}

function choose(q, o, btn){
  answers[q.key] = o.text;
  haptic();
  // меняем вид кнопок: выбранная — цветная, остальные приглушены
  [...$("options").children].forEach(b=>{ b.classList.remove("selected"); b.classList.add("dim"); });
  btn.classList.remove("dim"); btn.classList.add("selected");
  paintProgress();
  setTimeout(()=>{ current++; current < QUESTIONS.length ? renderQuestion() : renderReview(); }, 550);
}

function renderReview(){
  $("resultList").innerHTML = QUESTIONS.map(q=>`<li><b>${q.title}</b>${answers[q.key]}</li>`).join("");
  show("review");
}

function goBack(){
  if ($("review").classList.contains("active")) { current = QUESTIONS.length-1; renderQuestion(); return; }
  if (current > 0){ current--; renderQuestion(); }
  else { show("start"); tg?.BackButton?.hide(); }
}
tg?.BackButton?.onClick(goBack);

$("startBtn").onclick = () => { current = 0; renderQuestion(); };
$("sendBtn").onclick = sendToSalebot;

/* =========================================================
   4. ОТПРАВКА ХУКА В SALEBOT
   POST https://chatter.salebot.pro/api/<api_key>/tg_callback
   message  — текст, на который сработает блок в Salebot
   user_id  — Telegram ID пользователя
   group_id — username бота
   q1..q4   — ответы (дополнительные параметры)
   ========================================================= */
async function sendToSalebot(){
  show("done");
  $("sendBtn").disabled = true;

  const user = tg?.initDataUnsafe?.user;
  const summary = QUESTIONS.map(q=>`${q.title} — ${answers[q.key]}`).join("\n");

  const body = new URLSearchParams({
    message: SALEBOT.trigger,
    user_id: user?.id ?? "",
    group_id: SALEBOT.botName,
    quiz_summary: summary,
    ...answers
  });

  try{
    // no-cors: браузер не даст прочитать ответ, но запрос дойдёт до Salebot
    await fetch(`https://chatter.salebot.pro/api/${SALEBOT.apiKey}/tg_callback`,
                { method:"POST", mode:"no-cors", body });
    $("spinner").style.display = "none";
    $("doneEmoji").style.display = "block";
    $("doneTitle").textContent = "Готово!";
    $("doneText").textContent = "Результат уже летит к вам в чат. Окно закроется само.";
    tg?.HapticFeedback?.notificationOccurred?.("success");
    setTimeout(()=>tg?.close(), 1800);
  }catch(e){
    $("spinner").style.display = "none";
    $("doneTitle").textContent = "Не удалось отправить";
    $("doneText").textContent = "Проверьте интернет и нажмите «Отправить» ещё раз.";
    $("sendBtn").disabled = false;
    setTimeout(renderReview, 1500);
  }
}
</script>
</body>
</html>
